node_name: control_middleware

policy_path: wbc_middleware/policy.onnx
metadata_path: wbc_middleware/onnx_metadata.json

imu_topic: /aima/hal/imu/torso/state
joint_state_topic: /aima/hal/joint/leg/state
joint_command_topic: /aima/hal/joint/leg/command
startup_trigger_service: /aima/middleware/startup
interactive_command_topic: /aima/middleware/command
interactive_command_timeout_s: 0.5

control_period_s: 0.02
state_timeout_s: 0.25
num_actions: 12
num_observations: 47
rnn_hidden_size: 64
rnn_num_layers: 1

default_angles:
  [-0.248, 0.0, 0.0, 0.5303, -0.2823, 0.0,
   -0.248, 0.0, 0.0, 0.5303, -0.2823, 0.0]

kps: [120, 120, 120, 150, 40, 30, 120, 120, 120, 150, 40, 30]
kds: [5, 5, 5, 5, 3, 2, 5, 5, 5, 5, 3, 2]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
commands_scale: [2.0, 2.0, 0.25]

command_source:
  type: zero
  segments: []

startup:
  move_to_default_tolerance: 0.15
  policy_hold_time_s: 0.5

mock_bridge:
  xml_path: resources/robots/x2/mjcf/scene.xml
  simulation_dt: 0.002
  state_publish_period_s: 0.002
  control_period_s: 0.02
  hold_nominal_pose_until_first_command: true
